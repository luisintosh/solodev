# Model ids live only under hosts.*.profiles: `think` plans and reviews, `implement` writes code and docs. Pinned and
# updated by hand when a better model ships; README.md's matrix must match.
#
# Role skills (`skills:`) carry the instructions; shadows (`shadows:`) are the agents that play them, each a thin shell
# with a model and hard denies. A shadow runs on its profile's model; `effort`, per host, overrides the profile's effort
# for that shadow. One shadow per model-and-effort a role needs, never one per lens: reviewers started together share a
# prompt cache only when their definition is the same. `budget` caps a skill body's lines (tools/check.ts enforces it).
#
# `permission` holds hard edit denies only, by path; what a shadow may run is a prompt rule (fragments/boundaries.md).
# Hosts have no shared permission config, so transpile renders them: Cursor gets them as prose restrictions, Claude
# Code adds Edit/Write to `disallowedTools` when editing is denied outright, Codex runs read-only then. Shadows get no
# fixed tool list on any host: they use what the session has. Claude Code also denies `Agent`, so a shadow starts no
# agents.

hosts:
  claude:
    profiles:
      think: { id: claude-opus-5-5, effort: medium }
      implement: { id: claude-sonnet-5-5, effort: high }
  codex:
    profiles:
      think: { id: gpt-6-astra, effort: medium }
      implement: { id: gpt-6.1-sol, effort: high }
  cursor:
    profiles:
      think: { id: gemini-4-argon, effort: high }
      implement: { id: grok-4.7, effort: high }

shadows:
  shadow-coder:
    profile: implement
    skills: [solo-code]
    description: >-
      Writes a feature's tests, code and the docs that live beside them (solo-code). Started by the /solo-task
      commander; the only agent that edits source.
    permission:
      edit:
        # The feature folder (spec, plan, reports) belongs to the commander and the reviewers; C2 and C4 trust it.
        "~/.agents/solodev/**": deny
    # The commander continues the coder for later journeys and fix rounds; those waits outlast Claude Code's 5m
    # subagent cache. 1h writes cost 2x, so only the continued shadow sets it.
    claude:
      cache_ttl: 1h

  shadow-spec-reviewer:
    profile: think
    # One agent per feature, on the stage that finds the most: worth the deeper pass.
    effort: { claude: high, codex: high }
    skills: [solo-review]
    description: >-
      Fresh-context spec reviewer: reviews a feature's spec and plan against the request before the gate (solo-review).
      Report-only; replies with its findings and writes no file.

  shadow-reviewer:
    profile: think
    skills: [solo-review]
    description: >-
      Fresh-context code reviewer: reviews a feature diff against its scenarios, alone or on one lens, and re-reviews a
      fix round (solo-review). Report-only; writes only review.md.

  shadow-verifier:
    profile: implement
    # QA drives the app and captures evidence: many tool calls, little judgment.
    effort: { claude: medium, codex: medium }
    skills: [solo-verify]
    description: >-
      Fresh-context verifier: checks the scenarios no test covers from outside the system (solo-verify). Report-only;
      replies with its verdicts and changes no file.

skills:
  solo-task:
    budget: 142
    description: >-
      Takes one feature from a request or ticket to a reviewed, tested pull request you merge: a spec you approve, one
      coder writing failing tests then code, a fresh-context review and QA, and a walkthrough of how it works and how to
      try it. Usage: /solo-task <request, or ticket URL or id> [--writer claude|codex|cursor]; /solo-task continue;
      /solo-task explain [<slug>]; /solo-task init [claude|codex|cursor]. Use for features that touch several files,
      need design decisions or have unclear requirements, or to resume one. Not for one-line fixes or simple,
      well-defined changes (suggest /plan), or roadmaps (/solo-epic).
  solo-plan:
    budget: 113
    description: >-
      Writes a feature's spec.md (requirements, @S<n> acceptance scenarios, and a plan with the approach and journeys)
      for the spec gate. Used by /solo-task, or on its own to spec a feature without running it.
  solo-code:
    budget: 80
    description: >-
      Implements an approved plan: makes each journey's test prove its scenarios, failing before the change and passing
      after it. Loaded by shadow-coder for a /solo-task run.
  solo-review:
    budget: 90
    description: >-
      Independent review of a spec and plan, or of a feature diff against its scenarios: one reviewer for a small
      change, parallel reviewers each on one lens (evidence, correctness, security, design, UI) for a large or sensitive
      one, findings merged in review.md. Used by /solo-task in a fresh context, or by the user on any branch.
  solo-verify:
    budget: 54
    description: >-
      Checks the acceptance scenarios no journey test covers, from outside the system, and replies with a verdict per
      scenario. Loaded by shadow-verifier for a /solo-task run.
  solo-epic:
    budget: 150
    description: >-
      Plans an epic for a product owner or manager: turns an idea into a measurable goal, the chosen approach, a data
      model and a roadmap of features in waves, then files it in your tracker (GitHub, GitLab, Jira, Linear) as an epic
      with one ready-to-assign ticket per feature, or keeps drafts outside the repo without one. Usage: /solo-epic
      <idea>; /solo-epic <epic ticket or URL> to revise it. Plans only: developers build each ticket with whatever
      workflow they use.
  gen-docs:
    budget: 50
    user_only: true
    description: >-
      Writes a minimal AGENTS.md (the commands list, plus constraints the code doesn't show) and docs/ARCHITECTURE.md,
      mapping the repo once so agents and /solo-task runs don't rediscover it. Optional; run by the user as /gen-docs.
