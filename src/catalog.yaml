# No model ids live in solodev. Each host has a default for the coder, a short `<model>/<effort>` value
# (`sonnet/high`) that the commander passes when it starts shadow-coder and resolves to a real model itself; the user's
# `coder:` in ~/.agents/solodev/solodev-conf.yaml overrides it, and `session` runs the coder on the session's model.
# README.md's coder row must match. Every other role (spec reviewer, reviewer, verifier) is a fresh generic subagent on
# the session's model and effort, so it needs no shadow.
#
# Role skills (`skills:`) carry the instructions; shadows (`shadows:`) are the agents that play them, each a thin shell
# with hard denies and no model. `budget` caps a skill body's lines (tools/check.ts enforces it).
#
# `permission` holds hard edit denies only, by path; what a shadow may run is a prompt rule (fragments/boundaries.md).
# Hosts have no shared permission config, so transpile renders them: Cursor gets them as prose restrictions, Claude
# Code adds Edit/Write to `disallowedTools` when editing is denied outright, Codex runs read-only then. Shadows get no
# fixed tool list on any host: they use what the session has. Claude Code also denies `Agent`, so a shadow starts no
# agents.

hosts:
  claude: { coder: sonnet/high }
  codex: { coder: sol/high }
  cursor: { coder: grok/high }

shadows:
  shadow-coder:
    skills: [solo-code]
    description: >-
      Writes a feature's tests, code and the docs that live beside them (solo-code). Started by the /solo-task
      commander; the only agent that edits source.
    permission:
      edit:
        # The feature folder (spec, plan, reports) belongs to the commander and the reviewers; C2 and C4 trust it.
        "~/.agents/solodev/**": deny
    # The commander continues the coder for later journeys and fix rounds; those waits outlast Claude Code's 5m
    # subagent cache. 1h writes cost 2x, so only the continued shadow sets it.
    claude:
      cache_ttl: 1h

skills:
  solo-task:
    budget: 135
    argument_hint: >-
      <request or ticket> [--writer claude|codex|cursor] | continue | explain [<slug>] | feedback [<slug> | <PR url> |
      <file> | "<review>"] | init [<tool>] | coder [<tool>] [<model>/<effort> | session | default]
    description: >-
      Takes one feature from a request or ticket to a reviewed, tested pull request you merge: a spec you approve, one
      coder writing tests and code, each test seen failing without the code, a fresh-context review and QA, and a
      walkthrough of how it works and how to try it. Usage: /solo-task <request, or ticket URL or id> [--writer
      claude|codex|cursor]; /solo-task continue; /solo-task explain [<slug>]; /solo-task feedback [<slug>, PR URL, file
      or review text] for a round of PR or written review; /solo-task init [claude|codex|cursor]; /solo-task coder
      [<tool>] [<model>/<effort>] to show or set the coder's model. Use for features that touch several files, need
      design decisions or have unclear requirements, or to resume one. Not for one-line fixes or simple, well-defined
      changes (suggest /plan), or roadmaps (/solo-epic).
  solo-plan:
    budget: 109
    description: >-
      Writes a feature's spec.md (requirements, @S<n> acceptance scenarios, and a plan with the approach and journeys)
      for the spec gate. Used by /solo-task, or on its own to spec a feature without running it.
  solo-code:
    budget: 84
    description: >-
      Implements an approved plan: makes each journey's test prove its scenarios, failing before the change and passing
      after it. Loaded by shadow-coder for a /solo-task run.
  solo-review:
    budget: 76
    description: >-
      Independent review of a spec and plan, or of a feature diff against its scenarios: one reviewer for a small
      change, parallel reviewers each on one lens (evidence, correctness, security, design, UI) for a large or sensitive
      one, findings merged in review.md. Used by /solo-task in a fresh context, or by the user on any branch.
  solo-verify:
    budget: 54
    description: >-
      Checks the acceptance scenarios no journey test covers, from outside the system, and replies with a verdict per
      scenario. Loaded by the verifier subagent for a /solo-task run.
  solo-epic:
    budget: 150
    argument_hint: "<idea> | <epic ticket or URL>"
    description: >-
      Plans an epic for a product owner or manager: turns an idea into a measurable goal, the chosen approach, a data
      model and a roadmap of features in waves, then files it in your tracker (GitHub, GitLab, Jira, Linear) as an epic
      with one ready-to-assign ticket per feature, or keeps drafts outside the repo without one. Usage: /solo-epic
      <idea>; /solo-epic <epic ticket or URL> to revise it. Plans only: developers build each ticket with whatever
      workflow they use.
  gen-docs:
    budget: 50
    user_only: true
    description: >-
      Writes a minimal AGENTS.md (the commands list, plus constraints the code doesn't show) and docs/ARCHITECTURE.md,
      mapping the repo once so agents and /solo-task runs don't rediscover it. Optional; run by the user as /gen-docs.
