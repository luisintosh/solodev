# Model ids live only under hosts.*.profiles: `think` plans and reviews, `implement` writes code and docs. Pinned and
# updated by hand when a better model ships; README.md's matrix must match.
#
# Role skills (`skills:`) carry the instructions; shadows (`shadows:`) are the two agents that play them, each a thin
# shell with a model and hard denies. `budget` caps a skill body's lines (tools/check.ts enforces it).
#
# `permission` holds hard edit denies only, by path; what a shadow may run is a prompt rule (fragments/boundaries.md).
# Hosts have no shared permission config, so transpile renders them: Cursor gets them as prose restrictions, Claude
# Code drops Edit/Write from `tools` when editing is denied outright, Codex runs read-only then.

hosts:
  claude:
    profiles:
      think: { id: claude-opus-5-5, effort: medium }
      implement: { id: claude-sonnet-5-5, effort: high }
  codex:
    profiles:
      think: { id: gpt-6-astra, effort: max }
      implement: { id: gpt-6.1-sol, effort: max }
  cursor:
    profiles:
      think: { id: gemini-4-argon, effort: high }
      implement: { id: grok-4.7, effort: high }

shadows:
  shadow-coder:
    profile: implement
    skills: [solodev-code]
    description: >-
      Writes a feature's tests, code and the docs that live beside them (solodev-code). Started by the /mission
      commander; the only agent that edits source.
    permission:
      edit:
        # The feature folder (spec, plan, reports) belongs to the commander and the reviewers; C2 and C4 trust it.
        "~/.agents/solodev/**": deny
    # The commander continues the coder for later journeys and fix rounds; those waits outlast Claude Code's 5m
    # subagent cache. 1h writes cost 2x, so only the continued shadow sets it.
    claude:
      cache_ttl: 1h

  shadow-reviewer:
    profile: think
    skills: [solodev-review, solodev-verify]
    description: >-
      Fresh-context reviewer: reviews a spec or a diff (solodev-review) or checks scenarios no test covers
      (solodev-verify), following the role skill its brief names. Report-only; writes only review.md.

skills:
  mission:
    budget: 131
    description: >-
      Carries one feature from request to a reviewed, tested, unmerged pull request: spec and plan, a human gate, one
      coder writing failing tests then code, a fresh-context review, QA. Use for new features that touch multiple files,
      need architectural decisions, integrate with existing code, or have unclear requirements; or to resume one. Not
      for one-line fixes, trivial or well-defined simple changes (suggest /plan), or roadmaps (/strategy).
  solodev-plan:
    budget: 113
    description: >-
      Writes a feature's spec.md (requirements, @S<n> acceptance scenarios, and a plan with the approach and journeys)
      for the spec gate. Used by /mission, or on its own to spec a feature without running it.
  solodev-code:
    budget: 80
    description: >-
      Implements an approved plan: makes each journey's test prove its scenarios, failing before the change and passing
      after it. Loaded by shadow-coder for a /mission run.
  solodev-review:
    budget: 90
    description: >-
      Independent review of a spec and plan, or of a feature diff against its scenarios: one reviewer for a small
      change, parallel reviewers each on one lens (evidence, contract, correctness, security, design, UI) for a large or
      sensitive one, findings merged in review.md. Used by /mission in a fresh context, or by the user on any branch.
  solodev-verify:
    budget: 52
    description: >-
      Checks the acceptance scenarios no journey test covers, from outside the system, and records a verdict per
      scenario in review.md. Loaded by shadow-reviewer for a /mission run.
  strategy:
    budget: 150
    description: >-
      Product strategy: turns a raw idea into a measurable goal, a data model and a feature roadmap, filed in your
      tracker as an epic with one ticket per feature (or kept as drafts outside the repo without a tracker). Use to plan
      a product, write or revise a roadmap, or turn an idea into sequenced features. Standalone; each feature later runs
      through /mission.
  gen-docs:
    budget: 50
    user_only: true
    description: >-
      Writes a minimal AGENTS.md (the commands list, plus constraints the code doesn't show) and docs/ARCHITECTURE.md,
      mapping the repo once so agents and /mission runs don't rediscover it. Optional; run by the user as /gen-docs.
