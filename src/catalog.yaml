# Per-agent metadata. Model IDs live only under hosts.*.profiles.
# Agents declare profile; host blocks are adapters (skill, cache TTL).
#
# `permission` holds hard denies only. Hosts have no shared permission config, so transpile renders them: Cursor gets
# them as prose restrictions, Claude Code drops Edit/Write or Bash from `tools` when a whole tool is denied.

hosts:
  cursor:
    profiles:
      conduct: { id: inherit }
      think: { id: grok-4.7, effort: xhigh }
      execute: { id: grok-4.7, effort: high }
      design-review: { id: grok-4.7, effort: high }
      code-review: { id: claude-sonnet-5-5, effort: high }
      validate: { id: grok-4.7, effort: medium }
      write: { id: grok-4.7, effort: medium }
  claude:
    profiles:
      conduct: { id: inherit }
      think: { id: opus, effort: medium }
      execute: { id: sonnet, effort: high }
      design-review: { id: sonnet, effort: high }
      code-review: { id: opus, effort: high }
      validate: { id: sonnet, effort: medium }
      write: { id: sonnet, effort: medium }
  codex:
    profiles:
      conduct: { id: inherit }
      think: { id: gpt-6.1-sol, effort: xhigh }
      execute: { id: gpt-6.1-sol, effort: high }
      design-review: { id: gpt-6.1-sol, effort: high }
      code-review: { id: gpt-6.1-sol, effort: high }
      validate: { id: gpt-6.1-sol, effort: high }
      write: { id: gpt-6-luna, effort: medium }

# Optional supervised dispatch. When `quest-state probe orchestrator` finds Orca
# plus the routed CLIs, the conductor starts each specialist as an Orca worker on
# the CLI/model below instead of the host's own subagent. `conduct` is absent:
# the conductor is never dispatched. Cursor ids carry their effort.
orchestrators:
  orca:
    profiles:
      think: { agent: claude, id: opus, effort: medium }
      code-review: { agent: claude, id: sonnet, effort: high }
      design-review: { agent: claude, id: sonnet, effort: high }
      execute: { agent: cursor, id: grok-4.7-low }
      validate: { agent: cursor, id: grok-4.7-high }
      write: { agent: cursor, id: grok-4.7-high }

agents:
  # `command` is the name users invoke as a skill (/arise). Without it, the key is the name.
  commander:
    command: arise
    profile: conduct
    description: >-
      Drives the end-to-end spec-driven development (SDD) feature pipeline — sequences stages, manages human-in-the-loop
      gates, routes review findings, keeps docs in sync. Use when the user asks to implement a feature, run SDD, or
      resume/continue a pipeline. Treats a normal feature request as a request to run the full workflow. Not for product
      or roadmap planning (arise-plan) or one-line edits such as a typo or a version bump.
    permission:
      edit:
        "docs/feats/**/state.yaml": deny
        "**/journal.ndjson": deny
    cursor:
      skill: true

  shadow-architect:
    profile: think
    description: >-
      Writes the feature design in one pass — spec (the what & why), spec-derived acceptance contracts, and the
      implementation plan with cheapest-oracle journeys and waypoints. Use when the conductor delegates design, or when
      a spec, its @S<n> scenarios, or a plan must be written or revised.
    permission:
      edit:
        "docs/feats/**/state.yaml": deny
        "**/journal.ndjson": deny
    cursor: {}
    # The conductor continues this agent after critique and design-gate edits, and those waits outlast Claude Code's
    # 5m subagent cache. 1h writes cost 2x, so set it only on agents that get continued.
    claude:
      cache_ttl: 1h

  shadow-architect-reviewer:
    profile: design-review
    description: >-
      Independent critique of a feature design (spec, contracts, plan) before its gate. Fixes unambiguous issues in
      place and reports the rest as structured findings. Use when the conductor delegates a design critique.
    permission:
      edit:
        "docs/feats/**/state.yaml": deny
        "**/journal.ndjson": deny
    cursor: {}

  shadow-implementer:
    profile: execute
    description: >-
      Writes the planned failing journey oracle, then the implementation, in one pass. Never weakens tests. Use when the
      conductor delegates implementation, an escalation re-derive, or a targeted-test fix.
    permission:
      edit:
        # Frozen inputs: spec, plan, contracts. Cucumber e2e *.feature lives
        # outside docs/feats/** and stays writable.
        "docs/feats/**": deny
    cursor: {}
    # The conductor continues this agent after each failed targeted test and in the review fix round; the test runs in
    # between outlast Claude Code's 5m subagent cache.
    claude:
      cache_ttl: 1h

  shadow-code-reviewer:
    profile: code-review
    description: >-
      Report-only review of one area of the feature implementation diff — contract, health, or design — against the
      checklist file the conductor names. The conductor runs three in parallel, one per area, and merges the findings.
      Use when the conductor delegates implementation review.
    permission:
      edit:
        # Frozen inputs, git internals, and host/agent config stay out of reach.
        "docs/feats/**": deny
        ".git/**": deny
        ".agents/**": deny
        ".claude/**": deny
        ".codex/**": deny
        ".cursor/**": deny
      # Report-only: no tests or git/tracker writes; the conductor runs sensors.
      bash:
        "git add*": deny
        "git rm*": deny
        "git mv*": deny
        "git restore*": deny
        "git update-index*": deny
        "git commit*": deny
        "git push*": deny
        "git reset*": deny
        "git checkout*": deny
        "git stash*": deny
        "gh *": deny
    cursor: {}

  shadow-qa:
    profile: validate
    description: >-
      Validates the implementation against spec + acceptance contracts. Prefers the committed journey oracle;
      agent-browser only for uncovered UI e2e paths. Posts the evidence report as a PR comment. Use when the conductor
      delegates QA.
    permission:
      edit:
        "docs/feats/**/state.yaml": deny
        "**/journal.ndjson": deny
    cursor: {}

  shadow-docs-writer:
    profile: write
    description: >-
      Writes the human-facing docs a finished feature leaves behind — the owning domain's README, plus AGENTS.md and
      docs/ARCHITECTURE.md. Current state only, never a changelog. Use when the conductor delegates docs-sync.
    permission:
      edit:
        # docs/feats/** is the conductor's.
        "docs/feats/**": deny
    cursor: {}

  shadow-product-owner:
    command: arise-plan
    profile: think
    description: >-
      Product Owner planner. Refines a raw idea into a measurable goal, then writes a feature roadmap at
      docs/product/<slug>/roadmap.md. Use when the user asks to plan a product, write a roadmap, or turn an idea into
      sequenced features. Standalone — does not run the SDD pipeline.
    permission:
      edit:
        "docs/feats/**/state.yaml": deny
        "**/journal.ndjson": deny
    cursor:
      skill: true

commands:
  arise-scout:
    description: >-
      Maps the repo once before the first /arise run: writes a minimal AGENTS.md (the commands list solodev reads, plus
      constraints the code doesn't show) and docs/ARCHITECTURE.md. Run by the user as /arise-scout.
