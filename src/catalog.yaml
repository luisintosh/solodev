# Model ids live only under hosts.*.profiles: `think` plans and reviews, `implement` writes code and docs. Pinned and
# updated by hand when a better model ships; README.md's matrix must match.
#
# Role skills (`skills:`) carry the instructions; shadows (`shadows:`) are the two agents that play them, each a thin
# shell with a model and hard denies. `budget` caps a skill body's lines (tools/check.ts enforces it).
#
# `permission` holds hard denies only. Hosts have no shared permission config, so transpile renders them: Cursor gets
# them as prose restrictions, Claude Code drops Edit/Write or Bash from `tools` when a whole tool is denied.

hosts:
  claude:
    profiles:
      think: { id: claude-opus-5-5, effort: medium }
      implement: { id: claude-sonnet-5-5, effort: high }
  codex:
    profiles:
      think: { id: gpt-6.1-sol, effort: max }
      implement: { id: gpt-6.1-sol, effort: medium }
  cursor:
    profiles:
      think: { id: grok-4.7, effort: xhigh }
      implement: { id: grok-4.7, effort: medium }

shadows:
  shadow-coder:
    profile: implement
    skills: [arise-coder]
    description: >-
      Writes a feature's tests, code and the docs that live beside them (arise-coder). Started by the /arise commander;
      the only agent that edits source.
    permission:
      edit:
        # The feature folder (spec, plan, reports) belongs to the commander and the reviewers.
        "~/.agents/solodev/**": deny
      bash:
        "git commit*": deny
        "git push*": deny
        "git reset*": deny
        "gh pr merge*": deny
    # The commander continues the coder for later journeys and fix rounds; those waits outlast Claude Code's 5m
    # subagent cache. 1h writes cost 2x, so only the continued shadow sets it.
    claude:
      cache_ttl: 1h

  shadow-reviewer:
    profile: think
    skills: [arise-reviewer, arise-verifier]
    description: >-
      Fresh-context reviewer: reviews a spec or a diff (arise-reviewer) or checks scenarios no test covers
      (arise-verifier), following the role skill its brief names. Report-only; writes only review.md or qa.md.
    permission:
      bash:
        "git add*": deny
        "git commit*": deny
        "git push*": deny
        "git reset*": deny
        "git checkout*": deny
        "git restore*": deny
        "git stash*": deny
        "gh pr merge*": deny
        "gh pr ready*": deny

skills:
  arise:
    budget: 150
    # Claude Code skills can set the session model while they run; Codex and Cursor use the session's model.
    profile: think
    description: >-
      Carries one feature from request to a reviewed, tested, unmerged pull request: spec and plan, a human gate, one
      coder writing failing tests then code, a fresh-context review, QA. Use for new features that touch multiple files,
      need architectural decisions, integrate with existing code, or have unclear requirements; or to resume one. Not
      for one-line fixes, trivial or well-defined simple changes (suggest /plan), or roadmaps (arise-strategist).
  arise-architect:
    budget: 100
    description: >-
      Writes a feature's spec.md (requirements and @S<n> acceptance scenarios) and plan.md (approach and journeys) for
      the spec gate. Used by /arise, or on its own to spec a feature without running it.
  arise-coder:
    budget: 80
    description: >-
      Implements an approved plan: for each journey, the failing test first, then the smallest change that passes it.
      Loaded by shadow-coder for an /arise run.
  arise-reviewer:
    budget: 90
    description: >-
      Independent review of a spec and plan, or of a feature diff against its scenarios: contract, health and structure
      in one pass, findings in review.md. Used by /arise in a fresh context, or by the user on any branch.
  arise-verifier:
    budget: 80
    description: >-
      Checks the acceptance scenarios no journey test covers, from outside the system, and records a verdict per
      scenario in qa.md. Loaded by shadow-reviewer for an /arise run.
  arise-strategist:
    budget: 150
    description: >-
      Product strategist: turns a raw idea into a measurable goal, a data model and a feature roadmap, filed as a GitHub
      epic with one issue per feature (or kept as drafts outside the repo without a tracker). Use to plan a product,
      write or revise a roadmap, or turn an idea into sequenced features. Standalone; each feature later runs through
      /arise.
  arise-scout:
    budget: 50
    user_only: true
    description: >-
      Optional: maps the repo once so /arise runs don't rediscover it: writes a minimal AGENTS.md (the commands list
      solodev reads, plus constraints the code doesn't show) and docs/ARCHITECTURE.md. Run by the user as /arise-scout.
